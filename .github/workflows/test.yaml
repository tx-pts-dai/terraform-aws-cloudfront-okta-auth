name: Tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lambda unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test "lambda/test/*.test.mjs"

  terraform:
    name: Terraform tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Terraform min/max versions
        id: minMax
        uses: clowdhaus/terraform-min-max@v3.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.minMax.outputs.maxVersion }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Test
        run: terraform test
